plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

// 실제 라이브러리 버전은 이 모듈을 쓰는 서비스가 정한다. 여기서는 BOM으로 맞추기만 한다.
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    // 401·403 응답을 web-common의 ApiResponse·ErrorCode로 만든다.
    api project(':web-common')

    // 이 모듈을 쓰는 서비스는 이미 webmvc·security 스타터를 갖고 있으므로 compileOnly로 둔다.
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'

    // 공개 API(Locator<Key> 등)에 jjwt 타입이 드러나므로 api, 구현체는 런타임에만 필요하다.
    api "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    testImplementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
