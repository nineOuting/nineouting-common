plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

dependencies {
    // Swagger UI(/swagger-ui.html)와 OpenAPI 문서(/v3/api-docs). 3.1.x가 Spring Boot 4.1 기준이다
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // @CurrentUser 파라미터를 문서에서 숨기려고 쓴다 (security-common을 쓰는 서비스만)
    compileOnly project(':security-common')

    testImplementation project(':security-common')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
