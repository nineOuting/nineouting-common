// 각 모듈이 io.spring.dependency-management 플러그인을 쓰므로 버전은 여기서 한 번만 선언한다.
plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'maven-publish'

    group = 'com.nineouting.backend'
    // 릴리스 시 워크플로가 -PreleaseVersion=<버전> 으로 덮어쓴다.
    version = project.findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    plugins.withId('java-library') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            // Spring이 @RequestParam 등의 이름을 리플렉션으로 읽으려면 필요하다 (Boot 플러그인을 쓰지 않아 직접 켠다).
            options.compilerArgs << '-parameters'
        }

        tasks.named('test') {
            useJUnitPlatform()
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                    // 버전을 BOM에 맡긴 의존성도 실제 해석된 버전을 게시 파일(pom, module)에 적는다.
                    // 없으면 버전 없는 의존성만 가진 observability가 게시되지 않는다.
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }
                }
            }
        }
    }

    // 게시 대상: GitHub Packages (nineOuting/nineouting-common)
    //  - CI: GITHUB_ACTOR + GITHUB_TOKEN (packages: write)
    //  - 로컬 수동 게시: ~/.gradle/gradle.properties 의 gpr.user / gpr.key (write:packages 토큰)
    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/nineOuting/nineouting-common')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: (findProperty('gpr.user') ?: '')
                    password = System.getenv('GITHUB_TOKEN') ?: (findProperty('gpr.key') ?: '')
                }
            }
        }
    }
}
