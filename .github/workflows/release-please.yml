# 릴리스 자동화
#   main에 Conventional Commits(feat:/fix:)가 쌓임
#   → release-please가 Release PR(버전 + CHANGELOG)을 만들거나 갱신
#   → 사람이 Release PR을 머지  ← 유일한 수동 단계
#   → GitHub Release + vX.Y.Z 태그 생성 → 빌드 통과 시 GitHub Packages에 게시
# 버전 규칙: 0.x 동안 feat=minor, fix=patch, breaking=minor (release-please-config.json)
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # 기본 브랜치가 바뀌어도 main을 대상으로 Release PR을 만들도록 고정한다.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Publish to GitHub Packages
        run: ./gradlew publish -PreleaseVersion=${{ needs.release-please.outputs.version }} --no-daemon --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
