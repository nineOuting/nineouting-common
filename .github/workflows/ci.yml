# 빌드·테스트 확인. 게시는 release-please.yml(정규)과 publish.yml(수동)이 맡는다.
name: CI

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev, stage]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube Cloud가 새로 바뀐 줄을 가리려면 이력이 필요하다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 게시 파일 검증까지 확인한다 (릴리스 때 처음 실패하는 일을 막는다)
      - name: Build
        run: ./gradlew build jacocoTestReport publishToMavenLocal --no-daemon --console=plain

      # SonarQube Cloud 품질 분석. 토큰이 아직 없으면 건너뛴다. 포크에서 온 PR은 시크릿이 없어 건너뛴다
      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon --console=plain
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
