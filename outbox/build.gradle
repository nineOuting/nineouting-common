plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
        mavenBom 'software.amazon.awssdk:bom:2.55.0'
    }
}

dependencies {
    api project(':event-contract')

    // 이 모듈을 쓰는 서비스는 data-jpa 스타터와 AWS SDK sns를 갖고 있어야 한다 (README 참고).
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'software.amazon.awssdk:sns'
    compileOnly 'org.springframework.boot:spring-boot-starter-json'
    compileOnly 'io.micrometer:micrometer-tracing'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'software.amazon.awssdk:sns'
    testImplementation 'org.springframework.boot:spring-boot-starter-json'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
